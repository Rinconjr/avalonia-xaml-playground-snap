name: rinconjr-avalonia-xaml-playground
# TODO: register the name with `snapcraft register <name>` before publishing.

title: Avalonia XAML Playground
base: core26
adopt-info: xaml-playground

summary: Interactive Avalonia XAML playground
# Keep the summary at or under 79 characters for optimal display.

description: |
  Avalonia XAML Playground is an interactive environment for experimenting with
  Avalonia XAML and seeing the rendered result live.

  This snap is a personal learning project and is not endorsed by the Avalonia
  project or its maintainers.

license: MIT
source-code: https://github.com/AvaloniaUI/XamlPlayground
issues: https://github.com/AvaloniaUI/XamlPlayground/issues

platforms:
  amd64:
  arm64:

grade: devel
# TODO: change to `stable` when ready for release to candidate/stable channels.
confinement: strict

apps:
  rinconjr-avalonia-xaml-playground:
    command: XamlPlayground.NetCore
    common-id: rinconjr-avalonia-xaml-playground
    desktop: usr/share/applications/rinconjr-avalonia-xaml-playground.desktop
    environment:
      # Force Avalonia/Skia to use the bundled fonts and avoid host-path drift.
      FONTCONFIG_PATH: ${SNAP}/etc/fonts
      FONTCONFIG_FILE: ${SNAP}/etc/fonts/fonts.conf
    plugs:
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - opengl
      - network
      - home

parts:
  xaml-playground:
    plugin: dotnet
    source: https://github.com/AvaloniaUI/XamlPlayground.git
    source-type: git
    source-depth: 1

    # Pull the version from the latest git tag, falling back to the commit hash.
    override-pull: |
      craftctl default
      version=$(git -C "${CRAFT_PART_SRC}" describe --tags --always 2>/dev/null || echo "0.0+git")
      craftctl set version="${version}"

    dotnet-version: "10.0"
    dotnet-configuration: Release
    dotnet-project: src/XamlPlayground.NetCore/XamlPlayground.NetCore.csproj
    dotnet-self-contained: true
    dotnet-verbosity: minimal

    build-packages:
      - git

    # Runtime libraries required by a self-contained .NET / Avalonia / Skia app.
    # If the app still fails with "cannot open libXXX.so", add the missing
    # package here and rebuild.
    stage-packages:
      # core26 is based on Ubuntu 26.04, which uses the 64-bit time_t (t64)
      # transition packages. Do not use "pkg-a | pkg-b" syntax here; snapcraft
      # does not support alternatives in stage-packages.
      - libicu78
      - zlib1g
      - libfontconfig1
      - libfreetype6
      - libharfbuzz0b
      - libpng16-16t64
      - libjpeg8
      - libgif7
      - libx11-6
      - libxcb1
      - libxau6
      - libxdmcp6
      - libice6
      - libsm6
      - libssl3t64
      - libcurl4t64
      - libgssapi-krb5-2
      - libkrb5-3
      - libk5crypto3
      - libcom-err2

    # Install the local .desktop entry into the standard location so the
    # `desktop:` key in apps resolves correctly. The .desktop file lives in this
    # repository, not in the upstream source part.
    override-prime: |
      craftctl default
      install -D -m 0644 \
        "${CRAFT_PROJECT_DIR}/snap/gui/rinconjr-avalonia-xaml-playground.desktop" \
        "${CRAFT_PRIME}/usr/share/applications/rinconjr-avalonia-xaml-playground.desktop"

# Silence benign library-linter warnings for libraries that are intentionally
# bundled or pulled in as transitive dependencies.
lint:
  ignore:
    - library:
        - libcoreclrtraceptprovider.so
        - usr/lib/**/libICE*
        - usr/lib/**/libSM*
        - usr/lib/**/libX11*
        - usr/lib/**/libxcb*
        - usr/lib/**/libXau*
        - usr/lib/**/libXdmcp*
        - usr/lib/**/libicu*
        - usr/lib/**/libcurl*
        - usr/lib/**/libgif*
        - usr/lib/**/libgraphite2*
        - usr/lib/**/libgssapi_krb5*
        - usr/lib/**/libharfbuzz*
        - usr/lib/**/libjpeg*
        - usr/lib/**/liblber*
        - usr/lib/**/libldap*
        - usr/lib/**/libnghttp2*
        - usr/lib/**/libpsl*
        - usr/lib/**/librtmp*
        - usr/lib/**/libsasl2*
        - usr/lib/**/libssh2*
        - usr/lib/**/libssl.so*
