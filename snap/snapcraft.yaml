name: rinconjr-avalonia-xaml-playground # TODO: you probably want to 'snapcraft register <name>'
base: core26 # the base snap is the execution environment for this snap
version: '0.1' # just for humans, typically '1.2+git' or '1.3.2'
summary: A simple Avalonia XAML playground snap # 79 char long summary
description: |
  Avalonia XAML playground snap.

  This snap is not endorsed by the Avalonia project or its maintainers. It is a personal project of the snap author to learn how to create snaps and to experiment with Avalonia.

grade: devel # must be 'stable' to release into candidate/stable channels
confinement: devmode # use 'strict' once you have the right plugs and slots

parts:
  my-part:
    # See 'snapcraft plugins'
    plugin: nil
